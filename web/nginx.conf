upstream forge_admin {
    server forge-admin:9010;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    client_max_body_size 50m;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy — forward to Go backend
    location /forge/api/ {
        proxy_pass http://forge_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets with long-term cache
    location /forge/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback for all other forge routes
    location /forge/ {
        try_files $uri $uri/ /forge/index.html;
    }
}
