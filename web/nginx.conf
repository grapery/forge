server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    client_max_body_size 50m;

    # Docker DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy — forward to Go backend (variable-based for runtime DNS)
    location /forge/api/ {
        set $backend "forge-admin:9010";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Static assets with long-term cache
    location /forge/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Strip trailing slash for page routes (Next.js exports .html files, not directories)
    location ~ ^/forge/(?!api/|_next/)(.+)/$ {
        return 301 /forge/$1;
    }

    # SPA fallback — try .html file first, then index.html
    location /forge/ {
        try_files $uri $uri.html /forge/index.html;
    }

    # Deny anything outside /forge and /health
    location / {
        return 404;
    }
}
