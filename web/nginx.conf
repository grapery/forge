server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static assets with long-term cache
    location /forge/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback for all forge routes
    location /forge/ {
        try_files $uri $uri/ /forge/index.html;
    }
}
