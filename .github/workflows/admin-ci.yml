name: Forge Admin CI/CD

on:
  push:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.github/workflows/admin-ci.yml'
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'
  REGISTRY: ${{ vars.ACR_REGISTRY || 'crpi-kz6w8hb0pa94yvgy.cn-hangzhou.personal.cr.aliyuncs.com' }}
  IMAGE_NAME: forge-admin
  SERVICE_NAME: admin
  SERVICE_PORT: '9010'
  DEPLOY_DIR: /home/ubuntu/grapery/forge

jobs:
  # ========================================
  # 前端构建 + Go 构建验证
  # ========================================
  build:
    name: Build Forge Admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        env:
          # 与 ngx /forge/ 反代及 next.config basePath 一致
          NEXT_PUBLIC_FORGE_API_URL: /forge
        run: |
          cd web
          npm ci
          npm run build
          echo "Frontend build completed"
          ls -lh out/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build Go binary
        run: |
          VERSION=$(echo ${{ github.sha }} | cut -c1-7)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          mkdir -p internal/frontend/dist
          cp -r web/out/* internal/frontend/dist/

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}" \
            -o ./bin/${{ env.SERVICE_NAME }} ./cmd/${{ env.SERVICE_NAME }}

          echo "Build completed"
          ls -lh ./bin/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ env.SERVICE_NAME }}
          path: bin/${{ env.SERVICE_NAME }}
          retention-days: 7

  # ========================================
  # Docker 构建 - Develop
  # ========================================
  docker-develop:
    name: Docker Build (Develop)
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev \
            --build-arg VERSION=develop-${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .
          docker push ${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev

  # ========================================
  # Docker 构建 - Production
  # ========================================
  docker-production:
    name: Docker Build (Production)
    runs-on: ubuntu-latest
    needs: build
    # 生产部署默认关闭；就绪后在仓库 Variables 设置 ENABLE_FORGE_PROD_DEPLOY=true
    if: |
      vars.ENABLE_FORGE_PROD_DEPLOY == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        run: echo ${{ vars.ACR_PASSWORD }} | docker login ${{ env.REGISTRY }} -u ${{ vars.ACR_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
            .
          docker push ${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod

  # ========================================
  # 部署到开发环境
  # ========================================
  deploy-develop:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: docker-develop
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env << EOF
          # ========== Docker ==========
          IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev

          # ========== Service ==========
          FORGE_ENV=development
          FORGE_HTTP_PORT=${{ env.SERVICE_PORT }}
          FORGE_LOG_LEVEL=debug
          FORGE_ALLOW_ORIGINS=*

          # ========== Database ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery_dev' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}

          # ========== JWT ==========
          FORGE_JWT_SECRET=${{ vars.FORGE_JWT_SECRET || 'forge-dev-secret-change-in-prod' }}
          FORGE_JWT_ACCESS_EXPIRY=${{ vars.FORGE_JWT_ACCESS_EXPIRY || '24h' }}
          FORGE_JWT_REFRESH_EXPIRY=${{ vars.FORGE_JWT_REFRESH_EXPIRY || '168h' }}
          EOF

      - name: Deploy notification
        run: |
          echo "## Development Deployment - Forge Admin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | forge-${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | development |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev\` |" >> $GITHUB_STEP_SUMMARY
          echo "| DB_DATABASE | \`grapery_dev\` (default) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Config checks" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ vars.DB_PASSWORD != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY
          echo "- FORGE_JWT_SECRET: ${{ vars.FORGE_JWT_SECRET != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY
          echo "- SSH_KEY: ${{ vars.SSH_KEY != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After first deploy or nginx route changes, run **ngx** \`ngx-ci.yml\` (workflow_dispatch)." >> $GITHUB_STEP_SUMMARY

      - name: Prepare SSH private key
        id: ssh_key
        env:
          SSH_KEY: ${{ vars.SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY// }" ]; then
            echo "::error::vars.SSH_KEY is empty"
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/deploy_ssh_key.pem"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::vars.SSH_KEY is not valid PEM (must keep line breaks; copy from grapery repo or .pem file)"
            exit 1
          fi
          echo "path=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload files to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key_path: ${{ steps.ssh_key.outputs.path }}
          port: 22
          source: ".env,docker-compose.yml"
          target: "${{ env.DEPLOY_DIR }}/"

      - name: Remote Deploy to Development
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.DEV_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key_path: ${{ steps.ssh_key.outputs.path }}
          port: 22
          script: |
            SERVICE_DIR="${{ env.DEPLOY_DIR }}"
            mkdir -p "$SERVICE_DIR"
            cd "$SERVICE_DIR"

            export REGISTRY=${{ env.REGISTRY }}
            echo "${{ vars.ACR_PASSWORD }}" | docker login $REGISTRY -u "${{ vars.ACR_USERNAME }}" --password-stdin

            export IMAGE=${{ env.REGISTRY }}/grapery-dev/${{ env.IMAGE_NAME }}:dev
            docker pull "$IMAGE"

            docker network create grapery-network 2>/dev/null || echo "Network already exists"

            docker compose -p forge-admin down 2>/dev/null || true
            docker compose -p forge-admin up -d

            docker image prune -f

  # ========================================
  # 部署到生产环境
  # ========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-production
    if: |
      vars.ENABLE_FORGE_PROD_DEPLOY == 'true' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env << EOF
          # ========== Docker ==========
          IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod

          # ========== Service ==========
          FORGE_ENV=production
          FORGE_HTTP_PORT=${{ env.SERVICE_PORT }}
          FORGE_LOG_LEVEL=info
          FORGE_ALLOW_ORIGINS=${{ vars.FORGE_ALLOW_ORIGINS || '*' }}

          # ========== Database ==========
          DB_DATABASE=${{ vars.DB_DATABASE || 'grapery' }}
          DB_USERNAME=${{ vars.DB_USERNAME }}
          DB_PASSWORD=${{ vars.DB_PASSWORD }}
          DB_ADDRESS=${{ vars.DB_ADDRESS }}

          # ========== JWT ==========
          FORGE_JWT_SECRET=${{ vars.FORGE_JWT_SECRET }}
          FORGE_JWT_ACCESS_EXPIRY=${{ vars.FORGE_JWT_ACCESS_EXPIRY || '8h' }}
          FORGE_JWT_REFRESH_EXPIRY=${{ vars.FORGE_JWT_REFRESH_EXPIRY || '72h' }}
          EOF

      - name: Deploy notification
        run: |
          echo "## Production Deployment - Forge Admin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | forge-${{ env.SERVICE_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Port | ${{ env.SERVICE_PORT }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | production |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod\` |" >> $GITHUB_STEP_SUMMARY
          echo "| DB_DATABASE | \`grapery\` (default) |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Config checks" >> $GITHUB_STEP_SUMMARY
          echo "- DB_PASSWORD: ${{ vars.DB_PASSWORD != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY
          echo "- FORGE_JWT_SECRET: ${{ vars.FORGE_JWT_SECRET != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY
          echo "- SSH_KEY: ${{ vars.SSH_KEY != '' && 'Set' || 'Missing' }}" >> $GITHUB_STEP_SUMMARY

      - name: Prepare SSH private key
        id: ssh_key
        env:
          SSH_KEY: ${{ vars.SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY// }" ]; then
            echo "::error::vars.SSH_KEY is empty"
            exit 1
          fi
          KEY_FILE="${RUNNER_TEMP}/deploy_ssh_key.pem"
          printf '%s\n' "$SSH_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::vars.SSH_KEY is not valid PEM (must keep line breaks; copy from grapery repo or .pem file)"
            exit 1
          fi
          echo "path=$KEY_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload files to ECS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key_path: ${{ steps.ssh_key.outputs.path }}
          port: 22
          source: ".env,docker-compose.yml"
          target: "${{ env.DEPLOY_DIR }}/"

      - name: Remote Deploy to Production
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ vars.PROD_DEPLOY_HOST }}
          username: ${{ vars.SSH_USER }}
          key_path: ${{ steps.ssh_key.outputs.path }}
          port: 22
          script: |
            SERVICE_DIR="${{ env.DEPLOY_DIR }}"
            mkdir -p "$SERVICE_DIR"
            cd "$SERVICE_DIR"

            export REGISTRY=${{ env.REGISTRY }}
            echo "${{ vars.ACR_PASSWORD }}" | docker login $REGISTRY -u "${{ vars.ACR_USERNAME }}" --password-stdin

            export IMAGE=${{ env.REGISTRY }}/grapery-prod/${{ env.IMAGE_NAME }}:prod
            docker pull "$IMAGE"

            docker network create grapery-network 2>/dev/null || echo "Network already exists"

            docker compose -p forge-admin down 2>/dev/null || true
            docker compose -p forge-admin up -d

            docker image prune -f
