services:
  forge-admin:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_ADMIN}
    container_name: forge-admin
    restart: unless-stopped
    ports:
      - "${FORGE_HTTP_PORT:-9010}:9010"
    env_file:
      - .env
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9010/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  forge-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: ${IMAGE_WEB}
    container_name: forge-web
    restart: unless-stopped
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  grapery-network:
    external: true
