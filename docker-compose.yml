services:
  forge-admin:
    image: ${IMAGE}
    container_name: forge-admin
    restart: unless-stopped
    ports:
      - "${FORGE_HTTP_PORT:-9010}:9010"
    env_file:
      - .env
    networks:
      - grapery-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9010/health | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  # 与 ngx / server / vippay 等同机部署时共用（由 ngx-ci 或首次部署创建）
  grapery-network:
    external: true
